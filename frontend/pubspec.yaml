name: quickbite
description: "QuickBite — food delivery app (customer, restaurant, delivery, admin)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Pinned per assignment stack requirements (Milestone 1).
  flutter_riverpod: 3.4.3
  go_router: 18.1.0
  http: 1.6.0
  flutter_secure_storage: 11.2.0
  shared_preferences: 2.5.6
  intl: 0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  # End-to-end flow on a real device/emulator against the live Compose stack.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Pinned to the version flutter_riverpod 3.4.3 resolves (Override type for
  # test doubles is exported from package:riverpod/misc.dart only).
  riverpod: 3.4.3

flutter:
  uses-material-design: true

  # Photography: real licensed food images collected by
  # scripts/fetch_food_photos.py (per-file source + license in
  # assets/food/CREDITS.md). The generated placeholder art remains as the
  # deterministic fallback when an item has no image_asset.
  assets:
    - assets/images/
    - assets/food/

  # Display serif (QuickBite wordmark only) from the Google Fonts collection,
  # SIL Open Font License 1.1 (license text shipped at assets/fonts/OFL.txt).
  # Inter (same license, assets/fonts/Inter-OFL.txt) is the app's grotesque:
  # display headlines + body, bundled so Android and web render identically.
  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay[wght].ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
