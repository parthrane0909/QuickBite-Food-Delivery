# QuickBite local broker configuration (training environment).
# The Compose port mapping binds the management UI to 127.0.0.1 only; no
# broker or management port is exposed beyond the host loopback interface.
# Single-node broker with a persistent volume — this is NOT a claim of
# cluster high availability or protection against permanent disk loss
# (see docs/reliability.md).

management.listener.port = 15672
management.listener.ssl = false

# Keep disk alarms active so a full disk fails loudly instead of corrupting
# durable queues silently.
disk_free_limit.relative = 0.2
