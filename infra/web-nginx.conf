# QuickBite web SPA (Milestone 5) — nginx config for the Flutter web build.
#
# Serves the static build with a single-page-app fallback: every unknown path
# rewrites to /index.html so GoRouter's deep links (e.g. /orders/xyz) survive
# a hard reload or direct navigation — required by the assignment's "SPA
# fallback" note.
#
# The build itself is compiled with
#   --dart-define=API_BASE_URL=http://localhost:8000/api/v1
# and the API allows CORS from http://localhost:8080 (this service's port),
# so the browser talks to the API directly — no proxy and no secrets in the
# web bundle.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Flutter's main.dart.js is content-hashed per build; cache it hard.
    location /main.dart.js {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Assets (fonts, images, icons) are content-addressed too.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The manifest/HTML entry must always revalidate so a new deploy is picked
    # up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths -> index.html (GoRouter handles the rest).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never expose server internals.
    server_tokens off;
}
